name: Build MKmoney v1.3 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -oq PayCycle_v1_2_Android_Source.zip -d .

      - name: Install v1.3 files
        shell: bash
        run: |
          set -e

          if [ -f "index.html" ]; then
            SOURCE="."
          elif [ -f "MKmoney_v1_3_GitHub_Ready/index.html" ]; then
            SOURCE="MKmoney_v1_3_GitHub_Ready"
          else
            echo "ERROR: v1.3 index.html missing"
            exit 1
          fi

          TARGET="app/src/main/assets"
          mkdir -p "$TARGET/assets"

          cp "$SOURCE/index.html" "$TARGET/index.html"
          cp "$SOURCE/assets/mk-money-icon.png" \
            "$TARGET/assets/mk-money-icon.png"

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            cp "$SOURCE/android-icons/mipmap-$density/ic_launcher.png" \
              "app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Set version to 1.3
        run: |
          python3 - <<'PY'
          import pathlib, re

          for name in ("app/build.gradle", "app/build.gradle.kts"):
              path = pathlib.Path(name)
              if not path.exists():
                  continue

              content = path.read_text()
              content, n1 = re.subn(
                  r'versionName\s*(?:=\s*)?["\'][^"\']+["\']',
                  'versionName "1.3"' if name.endswith(".gradle")
                  else 'versionName = "1.3"',
                  content
              )
              codes = re.findall(
                  r'versionCode\s*(?:=\s*)?(\d+)', content
              )
              if codes:
                  code = max(3, int(codes[0]) + 1)
                  content = re.sub(
                      r'versionCode\s*(?:=\s*)?\d+',
                      f'versionCode {code}' if name.endswith(".gradle")
                      else f'versionCode = {code}',
                      content,
                      count=1
                  )
              if not n1:
                  raise SystemExit("Version name not found")
              path.write_text(content)
              break
          else:
              raise SystemExit("Android build.gradle not found")
          PY

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            MKmoney_v1.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3-APK
          path: MKmoney_v1.3.apk
          if-no-files-found: error

