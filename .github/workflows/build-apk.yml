name: Build MKmoney v1.3.1 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and corrected v1.3.1 app
        shell: bash
        run: |
          set -euo pipefail
          unzip -oq PayCycle_v1_2_Android_Source.zip -d .
          unzip -oq MKmoney_v1_3_1_GitHub_Ready.zip -d .
          test -f MKmoney_v1_3_GitHub_Ready/index.html
          mkdir -p app/src/main/assets
          cp MKmoney_v1_3_GitHub_Ready/index.html app/src/main/assets/index.html
          mkdir -p app/src/main/assets/assets
          cp MKmoney_v1_3_GitHub_Ready/assets/mk-money-icon.png app/src/main/assets/assets/mk-money-icon.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-$density"
            cp "MKmoney_v1_3_GitHub_Ready/android-icons/mipmap-$density/ic_launcher.png" "app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "MKmoney_v1_3_GitHub_Ready/android-icons/mipmap-$density/ic_launcher_round.png" "app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
      - name: Configure app identity, logo and version
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          manifest=Path('app/src/main/AndroidManifest.xml')
          if not manifest.exists(): raise SystemExit('Missing AndroidManifest.xml')
          m=manifest.read_text()
          m,n=re.subn(r'<application\b', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', m, count=1)
          if n!=1: raise SystemExit('Application tag not found')
          # Drop old icon references if they existed before adding our launcher icons.
          m=re.sub(r'(android:(?:icon|roundIcon)="[^"]*"\s*)+',lambda x:x.group(0),m)
          # Deduplicate only the attributes within the application tag
          m=re.sub(r'<application\b[^>]*',lambda match: re.sub(r'\s+android:(?:icon|roundIcon)="[^"]+"','',match.group(0))+' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"',m,count=1)
          manifest.write_text(m)
          for name in ('app/build.gradle','app/build.gradle.kts'):
            p=Path(name)
            if not p.exists(): continue
            s=p.read_text()
            if name.endswith('kts'):
              s,n=re.subn(r'versionName\s*=\s*"[^"]*"','versionName = "1.3.1"',s,count=1)
              codes=re.findall(r'versionCode\s*=\s*(\d+)',s)
              if codes: s=re.sub(r'versionCode\s*=\s*\d+',f'versionCode = {max(int(codes[0])+1,4)}',s,count=1)
            else:
              s,n=re.subn(r'versionName\s+(?:"[^"]*"|\'[^\']*\')','versionName "1.3.1"',s,count=1)
              codes=re.findall(r'versionCode\s+(\d+)',s)
              if codes: s=re.sub(r'versionCode\s+\d+',f'versionCode {max(int(codes[0])+1,4)}',s,count=1)
            if n!=1: raise SystemExit('Could not update versionName')
            p.write_text(s)
            break
          else: raise SystemExit('Gradle app file missing')
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Export APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MKmoney_v1.3.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.1-APK
          path: MKmoney_v1.3.1.apk
          if-no-files-found: error
