name: Build MKmoney v1.3.2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MKmoney v1.3.2 source
        shell: bash
        run: |
          set -euo pipefail
          test -f MKmoney_v1.3.2_GitHub_Ready.zip
          unzip -oq MKmoney_v1.3.2_GitHub_Ready.zip -d .
          test -f app/build.gradle
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/au/com/paycycle/planner/MainActivity.java
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
