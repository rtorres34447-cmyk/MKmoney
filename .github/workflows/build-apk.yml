name: Build PayCycle v1.2 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract v1.2 source
        run: unzip -oq PayCycle_v1_2_Android_Source.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Android v1.2
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PayCycle-v1.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
