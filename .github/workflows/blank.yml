name: Build Afterpay Scanner APK v2.8

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'index.html'
      - 'icons/**'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify scanner and logo
        run: |
          test -s index.html
          test -s icons/icon-192.png
          test -s android/settings.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle latest HTML and icons in APK
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html android/app/src/main/assets/index.html
          cp manifest.webmanifest android/app/src/main/assets/manifest.webmanifest
          cp icons/icon-192.png android/app/src/main/assets/icons/icon-192.png
          cp icons/icon-512.png android/app/src/main/assets/icons/icon-512.png
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Afterpay-Scanner-v2.8-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
