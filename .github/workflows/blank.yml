name: Build MKmoney v1.3.36 (Transparent Calendar Widget)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Assemble last successful v1.3.35 and add native calendar widget
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip \
            MKmoney-v1.3.10-Today-Workweek-Update.zip \
            MKmoney-v1.3.14-Logo-and-Banks-Patch.zip \
            MKmoney-v1.3.15-Weekly-Archive-Patch.zip \
            MKmoney-v1.3.16-Paid-Archive-Patch.zip \
            MKmoney-v1.3.29-Validator-Fix.zip \
            MKmoney-v1.3.30-Bank-Funding-Workweeks.zip \
            MKmoney-v1.3.31-Week-Weekend-Collapse.zip \
            MKmoney-v1.3.34-Combined-UI-Fix.zip \
            MKmoney-v1.3.35-Panel-Placement-Fix.zip \
            MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip; do
            test -f "$file" || { echo "::error::Missing $file in repository root"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP"/{base,update,feature14,feature15,feature16,verify,feature30,feature31,feature34,feature35,feature36}
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/base"
          unzip -q MKmoney-v1.3.10-Today-Workweek-Update.zip -d "$RUNNER_TEMP/update"
          unzip -q MKmoney-v1.3.14-Logo-and-Banks-Patch.zip -d "$RUNNER_TEMP/feature14"
          unzip -q MKmoney-v1.3.15-Weekly-Archive-Patch.zip -d "$RUNNER_TEMP/feature15"
          unzip -q MKmoney-v1.3.16-Paid-Archive-Patch.zip -d "$RUNNER_TEMP/feature16"
          unzip -q MKmoney-v1.3.29-Validator-Fix.zip -d "$RUNNER_TEMP/verify"
          unzip -q MKmoney-v1.3.30-Bank-Funding-Workweeks.zip -d "$RUNNER_TEMP/feature30"
          unzip -q MKmoney-v1.3.31-Week-Weekend-Collapse.zip -d "$RUNNER_TEMP/feature31"
          unzip -q MKmoney-v1.3.34-Combined-UI-Fix.zip -d "$RUNNER_TEMP/feature34"
          unzip -q MKmoney-v1.3.35-Panel-Placement-Fix.zip -d "$RUNNER_TEMP/feature35"
          unzip -q MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip -d "$RUNNER_TEMP/feature36"
          SETTINGS="$(find "$RUNNER_TEMP/base" -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo '::error::Base project missing'; exit 1; }
          ROOT="$(dirname "$SETTINGS")"
          HTML="$(find "$RUNNER_TEMP/update" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$HTML" || { echo '::error::v1.3.10 HTML missing'; exit 1; }
          cp "$HTML" "$ROOT/app/src/main/assets/index.html"
          for version in feature14 feature15 feature16; do
            PATCH="$(find "$RUNNER_TEMP/$version" -type f -name apply_patch.py -print -quit)"
            test -n "$PATCH" || { echo "::error::Missing $version patch"; exit 1; }
            python3 "$PATCH" "$ROOT"
          done
          python3 "$RUNNER_TEMP/verify/validate_features.py" "$ROOT" "$RUNNER_TEMP/update"
          python3 "$RUNNER_TEMP/feature30/apply_1330.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature31/apply_1331.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature34/v32/apply_1332.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature34/v33/apply_1333.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature35/apply_1335.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature36/apply_136.py" "$ROOT"
          test -f "$ROOT/app/src/main/res/drawable/ic_launcher.png" || { echo '::error::Logo missing'; exit 1; }
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER" || MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.36-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
