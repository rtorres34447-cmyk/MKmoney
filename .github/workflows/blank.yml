        run: |
          set -euo pipefail
          mkdir -p project kitwork
          printf '%s' "$ZIP_BASE64" | base64 -d > kit.zip
          unzip -q kit.zip -d kitwork
          mv kitwork/mkmoney2kit kit
          # Full finance application baseline committed in MKmoney, not Widget Lab.
          test -f MKmoney-Full-Source-v1.3.19.zip || { echo 'Missing baseline MKmoney-Full-Source-v1.3.19.zip'; exit 1; }
          unzip -q MKmoney-Full-Source-v1.3.19.zip -d project
          test -f project/app/src/main/assets/index.html
      - name: Integrate Widget Lab bridge and calendar into MKmoney
        run: |
          set -euo pipefail
          python3 kit/integrate.py
          grep -q 'MKCalendarBridge' project/app/src/main/java/com/mkmoney/app/MainActivity.java
          test -f project/app/src/main/res/layout/mk_calendar_widget.xml
      - name: Build real MKmoney APK
        working-directory: project
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug
      - name: Export integrated source ZIP
        if: success()
        run: |
          cd project
          zip -qr ../MKmoney-v2.0-Full-Integrated-Source.zip . -x '*/build/*' '*/.gradle/*'
      - name: Upload APK and source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v2.0-debug-APK-and-Source
          path: |
            project/app/build/outputs/apk/debug/*.apk
            MKmoney-v2.0-Full-Integrated-Source.zip
