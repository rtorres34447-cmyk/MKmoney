name: MKmoney Widget Diagnostic - XML Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Diagnostic Widget
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recover diagnostic source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/widget-project"

          curl --fail --location --retry 3 \
            --silent --show-error \
            "https://api.github.com/repos/rtorres34447-cmyk/MKmoney/git/blobs/543550fa7e368bafec64493e6861e39136ab59ee" \
            -o "$RUNNER_TEMP/source.json"

          python3 - <<'PY'
          import json
          import base64
          import re
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads(
              (root / "source.json").read_text()
          )

          original = base64.b64decode(
              data["content"]
          ).decode("utf-8")

          match = re.search(
              r"DIAGNOSTIC_ZIP_B64'\s*\n"
              r"(.*?)"
              r"\n\s*DIAGNOSTIC_ZIP_B64",
              original,
              re.S
          )

          if not match:
              raise RuntimeError(
                  "Diagnostic source not found"
              )

          archive = base64.b64decode(
              "".join(match.group(1).split())
          )

          (root / "widget.zip").write_bytes(archive)
          print("Diagnostic source recovered")
          PY

          unzip -t "$RUNNER_TEMP/widget.zip"

          unzip -q "$RUNNER_TEMP/widget.zip" \
            -d "$RUNNER_TEMP/widget-project"

          test -f \
            "$RUNNER_TEMP/widget-project/settings.gradle"

          echo "PROJECT_DIR=$RUNNER_TEMP/widget-project" \
            >> "$GITHUB_ENV"

      - name: Repair and validate XML layouts
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install --quiet lxml

          python3 - <<'PY'
          from pathlib import Path
          from lxml import etree
          import os

          root = Path(os.environ["PROJECT_DIR"])
          res = root / "app/src/main/res"

          for file in res.rglob("*.xml"):
              try:
                  etree.parse(str(file))
                  print("VALID:", file.name)
              except etree.XMLSyntaxError:
                  print("REPAIRING:", file)

                  parser = etree.XMLParser(
                      recover=True,
                      remove_blank_text=False
                  )

                  tree = etree.parse(
                      str(file), parser
                  )

                  if tree.getroot() is None:
                      raise RuntimeError(
                          "Cannot recover " + str(file)
                      )

                  tree.write(
                      str(file),
                      encoding="utf-8",
                      xml_declaration=True,
                      pretty_print=True
                  )

                  etree.parse(str(file))
                  print("REPAIRED:", file.name)

          widget = (
              res / "layout/widget_layout.xml"
          )

          if not widget.exists():
              raise RuntimeError(
                  "Widget layout missing"
              )

          etree.parse(str(widget))
          print("XML validation completed")
          PY

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n1)"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses \
            >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --install \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Compile diagnostic APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-Widget-Diagnostic-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
