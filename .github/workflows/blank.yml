name: MKmoney Widget Diagnostic - SDK Fixed

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Diagnostic Widget
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Recover diagnostic source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/widget-project"

          curl --fail --location --retry 3 \
            --silent --show-error \
            "https://api.github.com/repos/rtorres34447-cmyk/MKmoney/git/blobs/543550fa7e368bafec64493e6861e39136ab59ee" \
            -o "$RUNNER_TEMP/source.json"

          python3 - <<'PY'
          import json
          import base64
          import re
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          data = json.loads(
              (root / "source.json").read_text()
          )

          original = base64.b64decode(
              data["content"]
          ).decode("utf-8")

          match = re.search(
              r"DIAGNOSTIC_ZIP_B64'\s*\n"
              r"(.*?)"
              r"\n\s*DIAGNOSTIC_ZIP_B64",
              original,
              re.S
          )

          if not match:
              raise RuntimeError(
                  "Diagnostic project not found"
              )

          archive = base64.b64decode(
              "".join(match.group(1).split())
          )

          (root / "widget.zip").write_bytes(archive)
          print("Diagnostic source recovered")
          PY

          unzip -t "$RUNNER_TEMP/widget.zip"

          unzip -q "$RUNNER_TEMP/widget.zip" \
            -d "$RUNNER_TEMP/widget-project"

          test -f \
            "$RUNNER_TEMP/widget-project/settings.gradle"

          echo "PROJECT_DIR=$RUNNER_TEMP/widget-project" \
            >> "$GITHUB_ENV"

      - name: Configure existing Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n1)"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK" --licenses \
            >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$SDK" \
            --install \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Compile diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-Widget-Diagnostic-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
