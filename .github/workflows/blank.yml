name: MKmoney - Proven Widget Bridge Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-Bridge-Comparison-Audit.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Assemble preserved MKmoney v1.3.47 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, sys, zipfile, os
          temp=Path(os.environ['RUNNER_TEMP'])/'mkmoney_assemble'
          sequence=[
            ('base','MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip',None),
            ('update','MKmoney-v1.3.10-Today-Workweek-Update.zip',None),
            ('feature14','MKmoney-v1.3.14-Logo-and-Banks-Patch.zip','apply_patch.py'),
            ('feature15','MKmoney-v1.3.15-Weekly-Archive-Patch.zip','apply_patch.py'),
            ('feature16','MKmoney-v1.3.16-Paid-Archive-Patch.zip','apply_patch.py'),
            ('verify','MKmoney-v1.3.29-Validator-Fix.zip','validate_features.py'),
            ('feature30','MKmoney-v1.3.30-Bank-Funding-Workweeks.zip','apply_1330.py'),
            ('feature31','MKmoney-v1.3.31-Week-Weekend-Collapse.zip','apply_1331.py'),
            ('feature34','MKmoney-v1.3.34-Combined-UI-Fix.zip',None),
            ('feature35','MKmoney-v1.3.35-Panel-Placement-Fix.zip','apply_1335.py'),
            ('feature36','MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip','apply_136.py'),
            ('feature37','MKmoney-v1.3.37-Full-Month-Sync-Patch.zip','apply_1337.py'),
            ('feature38','MKmoney-v1.3.38-Theme-Sync-Patch.zip','apply_1338.py'),
            ('feature40','MKmoney-v1.3.40-Restore-Full-Month-Widget-Patch.zip','apply_1340.py'),
            ('feature41','MKmoney-v1.3.41-Interactive-Calendar-Patch.zip','apply_1341.py'),
            ('feature44','MKmoney-v1.3.44-JSONObject-Compatibility-Fix.zip','apply_native_widget.py'),
            ('feature45','MKmoney-v1.3.45-Widget-Data-Refresh-Fix.zip','apply_1345.py'),
            ('feature46','MKmoney-v1.3.46-Native-Sync-Integration.zip','apply_1346.py'),
            ('feature47','MKmoney-v1.3.47-Bridge-Diagnostic.zip','apply_1347.py'),
          ]
          for slot,name,_ in sequence:
            f=Path(name)
            if not f.is_file() or not f.stat().st_size: raise SystemExit('Missing required repository source: '+name)
            out=temp/slot;out.mkdir(parents=True,exist_ok=True)
            with zipfile.ZipFile(f) as z:z.extractall(out)
          settings=next((temp/'base').rglob('settings.gradle'),None)
          if not settings:raise SystemExit('Cannot locate settings.gradle in original base source')
          root=settings.parent
          html=next((temp/'update').rglob('app/src/main/assets/index.html'),None)
          if not html:raise SystemExit('Cannot locate base update HTML')
          import shutil
          shutil.copy2(html,root/'app/src/main/assets/index.html')
          for slot,_,script in sequence[2:]:
            if slot=='feature34':
              for v in ('v32/apply_1332.py','v33/apply_1333.py'):
                p=temp/slot/v
                if not p.is_file():raise SystemExit('Missing required '+str(p))
                subprocess.run([sys.executable,str(p),str(root)],check=True)
            elif script:
              paths=list((temp/slot).rglob(script))
              if len(paths)!=1:raise SystemExit('Missing or ambiguous patch '+slot+'/'+script)
              cmd=[sys.executable,str(paths[0]),str(root)]
              if slot=='verify':cmd.append(str(temp/'update'))
              subprocess.run(cmd,check=True)
          if not (root/'app/src/main/res/drawable/ic_launcher.png').is_file():
            raise SystemExit('App icon missing: refusing to produce broken build')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SOURCE_DIR='+str(root)+'\n')
          print('Preserved v1.3.47 assembled at',root)
          PY
      - name: Extract proven Widget Lab and audit both native bridges
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/widget_audit"
          unzip -q MKmoney-Bridge-Comparison-Audit.zip -d "$RUNNER_TEMP/widget_audit"
          python3 "$RUNNER_TEMP/widget_audit/compare_bridges.py" \
            "$SOURCE_DIR" "MK-Widget-Lab-v2.1-Source.zip" "$GITHUB_WORKSPACE/bridge-report"
      - name: Package assembled source for exact patching
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          zip -qr "$GITHUB_WORKSPACE/bridge-report/MKmoney-v1.3.47-Assembled-Source.zip" . \
            -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MKmoney-Proven-Bridge-Comparison
          path: bridge-report/*
          if-no-files-found: error
