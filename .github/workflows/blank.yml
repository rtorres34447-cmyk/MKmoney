name: Build MKmoney v1.3.10 APK (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - '*.zip'
      - 'app/**'
      - 'settings.gradle*'
      - 'build.gradle*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate Android project and apply v1.3.10 update
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/mkmoney-project"
          mkdir -p "$PROJECT"

          # Prefer an Android project already checked into the repository.
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            cp -a . "$PROJECT/"
          else
            # Fall back to source ZIPs, prioritising previously working source versions.
            mapfile -t sources < <(find . -maxdepth 2 -type f -iname '*.zip' \
              ! -iname '*update*.zip' ! -iname '*patch*.zip' \
              | sort -Vr)
            found=0
            for source in "${sources[@]}"; do
              candidate="$RUNNER_TEMP/source-candidate"
              rm -rf "$candidate"
              mkdir -p "$candidate"
              if ! unzip -q "$source" -d "$candidate"; then
                echo "Skipping damaged ZIP: $source"
                continue
              fi
              settings=$(find "$candidate" -maxdepth 5 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
              if [[ -n "$settings" ]]; then
                source_root=$(dirname "$settings")
                if [[ -d "$source_root/app" ]]; then
                  cp -a "$source_root/." "$PROJECT/"
                  echo "Using Android source from: $source"
                  found=1
                  break
                fi
              fi
            done
            if [[ "$found" != 1 ]]; then
              echo '::error::No complete Android source found. Upload the full MKmoney Android source ZIP to the repository root (not just the update ZIP).'
              exit 1
            fi
          fi

          # Use the matching v1.3.10 update when it exists; tolerate ZIP root folders.
          update=$(find . -maxdepth 2 -type f -iname '*v1.3.10*update*.zip' -print -quit)
          if [[ -n "$update" ]]; then
            updates="$RUNNER_TEMP/mkmoney-updates"
            mkdir -p "$updates"
            unzip -q "$update" -d "$updates"
            html=$(find "$updates" -type f -path '*/app/src/main/assets/index.html' -print -quit)
            if [[ -z "$html" ]]; then
              echo '::error::Update ZIP does not include app/src/main/assets/index.html'
              exit 1
            fi
            mkdir -p "$PROJECT/app/src/main/assets"
            cp "$html" "$PROJECT/app/src/main/assets/index.html"
            echo "Applied v1.3.10 update from: $update"
          else
            echo 'No v1.3.10 update ZIP found; checking whether it is already included in the source.'
          fi

          test -f "$PROJECT/app/src/main/assets/index.html" || { echo '::error::Missing app/src/main/assets/index.html'; exit 1; }
          if ! grep -q 'dashboardToday' "$PROJECT/app/src/main/assets/index.html"; then
            echo '::error::v1.3.10 dashboardToday change is missing. Upload the v1.3.10 Today-Workweek update ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo 'Android project and v1.3.10 update verified.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo '::error::Android SDK manager missing'; exit 1; }
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.10-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
