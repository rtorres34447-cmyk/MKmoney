name: Build MKmoney v1.3.14 (Launcher logo + bank 8PM)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.14-Logo-and-Banks-Patch.zip'
      - 'MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip'
      - 'MKmoney-v1.3.10-Today-Workweek-Update.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout GitHub files
        uses: actions/checkout@v4

      - name: Restore original logo source and apply updates
        shell: bash
        run: |
          set -euo pipefail
          BASE=MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip
          TODAY=MKmoney-v1.3.10-Today-Workweek-Update.zip
          PATCH=MKmoney-v1.3.14-Logo-and-Banks-Patch.zip
          for f in "$BASE" "$TODAY" "$PATCH"; do
            test -f "$f" || { echo "::error::Missing $f in repository root"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/updates" "$RUNNER_TEMP/patch"
          unzip -q "$BASE" -d "$RUNNER_TEMP/base"
          settings="$(find "$RUNNER_TEMP/base" -maxdepth 6 -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$settings" || { echo "::error::No Android source found in $BASE"; exit 1; }
          ROOT="$(dirname "$settings")"
          unzip -q "$TODAY" -d "$RUNNER_TEMP/updates"
          html="$(find "$RUNNER_TEMP/updates" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$html" || { echo "::error::v1.3.10 update is missing index.html"; exit 1; }
          mkdir -p "$ROOT/app/src/main/assets"
          cp "$html" "$ROOT/app/src/main/assets/index.html"
          unzip -q "$PATCH" -d "$RUNNER_TEMP/patch"
          test -f "$RUNNER_TEMP/patch/mkmoney_patch/apply_patch.py" || { echo "::error::Missing patch script"; exit 1; }
          python3 "$RUNNER_TEMP/patch/mkmoney_patch/apply_patch.py" "$ROOT"
          python3 - "$ROOT" <<'PYVERSION'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          gradles=[root/'app/build.gradle',root/'app/build.gradle.kts']
          gradle=next((p for p in gradles if p.is_file()),None)
          if not gradle:
              raise SystemExit("Missing Android app Gradle file")
          body=gradle.read_text()
          if not re.search(r'\bversionName\s*(?:=\s*)?["\'][^"\']+["\']',body):
              raise SystemExit("Cannot find versionName; refusing mislabeled APK")
          body,count=re.subn(r'(\bversionName\s*(?:=\s*)?)["\'][^"\']+["\']',r'\g<1>"1.3.14"',body,count=1)
          body=re.sub(r'(\bversionCode\s*(?:=\s*))(\d+)',lambda m:m.group(1)+str(max(int(m.group(2)), 1314)),body,count=1)
          gradle.write_text(body)
          html=root/'app/src/main/assets/index.html'
          h=html.read_text()
          h=re.sub(r'(?i)(\bMKmoney\s+v?)1\.3\.10\b',r'\g<1>1.3.14',h)
          html.write_text(h)
          print("Android versionName updated to 1.3.14")
          PYVERSION
          test -n "$(find "$ROOT/app/src/main/res" -type f \( -name 'ic_launcher*' -o -iname '*logo*' \) -print -quit)" || {
            echo "::error::Original logo resources missing; refusing to build an unbranded app"
            exit 1
          }
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK platform (avoid obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo "::error::sdkmanager not found"; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0' < /dev/null

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ -x ./gradlew ]]; then
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Verify launcher icon copied into source
        shell: bash
        run: |
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/mkmoney_launcher.png" || { echo "::error::Launcher PNG absent"; exit 1; }
          grep -q "@drawable/mkmoney_launcher" "$PROJECT_DIR/app/src/main/AndroidManifest.xml" || { echo "::error::Manifest icon not configured"; exit 1; }

      - name: Upload MKmoney APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.14-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
