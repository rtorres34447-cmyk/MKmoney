name: Build MKmoney v1.3.4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.4-Fixed-Workflow-Package.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract v1.3.4 Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP='MKmoney-v1.3.4-Fixed-Workflow-Package.zip'
          if [ ! -f "$ZIP" ]; then
            echo "::error::Missing ZIP at repository root: $ZIP"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mkmoney"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/mkmoney"
          PROJECT="$RUNNER_TEMP/mkmoney"
          for file in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$PROJECT/$file" ]; then
              echo "::error::ZIP is missing $file"
              exit 1
            fi
          done
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo 'Android project extracted successfully.'

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Configure Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.4-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
