name: Build MKmoney v1.3.16 (Custom banks + paid archive)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MKmoney-v1.3.16-Paid-Archive-Patch.zip'
      - 'blank.yml'
      - '*Source*.zip'
      - '*source*.zip'
      - 'app/**'
      - 'gradlew'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Prepare original source
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f app/src/main/assets/index.html ]]; then
            SOURCE=$(find . -maxdepth 2 -type f -iname '*source*.zip' ! -iname '*patch*' | head -n 1)
            if [[ -z "$SOURCE" ]]; then
              echo 'ERROR: Full original MKmoney Android source is missing. Upload the original source ZIP or commit the app/ directory.' >&2
              exit 1
            fi
            unzip -oq "$SOURCE" -d source-unpacked
            PROJECT=$(find source-unpacked -path '*/app/src/main/assets/index.html' -print -quit)
            [[ -n "$PROJECT" ]] || { echo 'ERROR: Original source archive has no app/src/main/assets/index.html'; exit 1; }
            PROJECT_DIR="${PROJECT%/app/src/main/assets/index.html}"
            cp -a "$PROJECT_DIR"/. ./
          fi
          test -f app/src/main/assets/index.html
      - name: Apply paid archive patch
        run: |
          set -euo pipefail
          unzip -oq MKmoney-v1.3.16-Paid-Archive-Patch.zip -d /tmp/mk-patch
          python3 /tmp/mk-patch/mkmoney_patch/apply_patch.py .
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.16-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
