name: Build MKmoney v1.3.24 (Existing WebChromeClient merge)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.24-CSV-Picker-Compile-Fix.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack full source, restore logo, apply CSV and picker patches
        shell: bash
        run: |
          set -euo pipefail
          for f in MKmoney-Full-Source-v1.3.19.zip MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip MKmoney-v1.3.20-Logo-Fix.zip MKmoney-v1.3.21-CSV-Import-Repair.zip MKmoney-v1.3.22-Import-Button-Fix.zip MKmoney-v1.3.24-CSV-Picker-Compile-Fix.zip; do
            test -f "$f" || { echo "::error::Missing $f from repository root"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/latest" "$RUNNER_TEMP/original" "$RUNNER_TEMP/logo" "$RUNNER_TEMP/csvfix" "$RUNNER_TEMP/pickerfix" "$RUNNER_TEMP/javafix"
          unzip -q MKmoney-Full-Source-v1.3.19.zip -d "$RUNNER_TEMP/latest"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/original"
          unzip -q MKmoney-v1.3.20-Logo-Fix.zip -d "$RUNNER_TEMP/logo"
          unzip -q MKmoney-v1.3.21-CSV-Import-Repair.zip -d "$RUNNER_TEMP/csvfix"
          unzip -q MKmoney-v1.3.22-Import-Button-Fix.zip -d "$RUNNER_TEMP/pickerfix"
          unzip -q MKmoney-v1.3.24-CSV-Picker-Compile-Fix.zip -d "$RUNNER_TEMP/javafix"
          LATEST_SETTINGS="$(find "$RUNNER_TEMP/latest" -type f -name settings.gradle -print -quit)"
          ORIGINAL_SETTINGS="$(find "$RUNNER_TEMP/original" -type f -name settings.gradle -print -quit)"
          test -n "$LATEST_SETTINGS" && test -n "$ORIGINAL_SETTINGS"
          ROOT="$(dirname "$LATEST_SETTINGS")"
          ORIGINAL="$(dirname "$ORIGINAL_SETTINGS")"
          python3 "$RUNNER_TEMP/logo/restore_logo.py" "$ROOT" "$ORIGINAL"
          python3 "$RUNNER_TEMP/csvfix/apply_csv_fix.py" "$ROOT"
          python3 "$RUNNER_TEMP/pickerfix/apply_picker_fix.py" "$ROOT"
          python3 "$RUNNER_TEMP/javafix/fix_main_activity.py" "$ROOT"
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"
      - name: Set application version
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['SOURCE_DIR'])
          gradle=next((p for p in (root/'app/build.gradle',root/'app/build.gradle.kts') if p.is_file()),None)
          if not gradle:raise SystemExit("App Gradle config missing")
          text=gradle.read_text()
          text,n=re.subn(r'(\bversionName\s*(?:=\s*)?)[\x22\x27][^\x22\x27]+[\x22\x27]', lambda m:m.group(1)+'"1.3.23"', text, count=1)
          if n!=1:raise SystemExit("versionName update failed")
          gradle.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then
            MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$MANAGER" && test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.24-debug-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
