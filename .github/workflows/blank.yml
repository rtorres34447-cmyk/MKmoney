name: Build MKmoney v1.3.3 APK (ZIP Source)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'MKmoney-v1.3.3-GitHub-Package.zip'
      - '.github/workflows/blank.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack MKmoney source
        shell: bash
        run: |
          set -euo pipefail
          test -s MKmoney-v1.3.3-GitHub-Package.zip
          mkdir -p buildsrc
          unzip -q MKmoney-v1.3.3-GitHub-Package.zip -d buildsrc
          test -s buildsrc/settings.gradle
          test -s buildsrc/app/src/main/assets/index.html
          test -s buildsrc/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu GitHub-hosted runner already has Android command-line tools.
      # Deliberately avoid android-actions/setup-android@v3: it requests the
      # removed legacy SDK package 'tools' on some runner images.
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "Using SDK at $SDK"
          "$SDKMANAGER" --version

      - name: Install Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build MKmoney APK
        run: gradle -p buildsrc --no-daemon --stacktrace assembleDebug

      - name: Upload MKmoney APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.3-debug-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
