name: Build MKmoney v1.3.26 (v1.3.10 clean rebuild)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.26-Rebase-v1.3.10.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from v1.3.10 and restore original logo
        shell: bash
        run: |
          set -euo pipefail
          for f in MKmoney-v1.3.10-Today-Workweek-Update.zip MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip MKmoney-v1.3.26-Rebase-v1.3.10.zip; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/logo" "$RUNNER_TEMP/update" "$RUNNER_TEMP/rebase"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/base"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/logo"
          unzip -q MKmoney-v1.3.10-Today-Workweek-Update.zip -d "$RUNNER_TEMP/update"
          unzip -q MKmoney-v1.3.26-Rebase-v1.3.10.zip -d "$RUNNER_TEMP/rebase"
          BASE_SETTINGS="$(find "$RUNNER_TEMP/base" -type f -name settings.gradle -print -quit)"
          LOGO_SETTINGS="$(find "$RUNNER_TEMP/logo" -type f -name settings.gradle -print -quit)"
          test -n "$BASE_SETTINGS" && test -n "$LOGO_SETTINGS" || { echo '::error::Missing Android source'; exit 1; }
          ROOT="$(dirname "$BASE_SETTINGS")"
          ORIGINAL="$(dirname "$LOGO_SETTINGS")"
          INDEX="$(find "$RUNNER_TEMP/update" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$INDEX" || { echo '::error::v1.3.10 index.html not found'; exit 1; }
          mkdir -p "$ROOT/app/src/main/assets"
          cp "$INDEX" "$ROOT/app/src/main/assets/index.html"
          python3 "$RUNNER_TEMP/rebase/restore_logo.py" "$ROOT" "$ORIGINAL"
          python3 "$RUNNER_TEMP/rebase/apply_import.py" "$ROOT"
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"
      - name: Set version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['SOURCE_DIR'])/'app/build.gradle'
          s=p.read_text()
          s,n=re.subn(r'(versionName\s*)["\x27][^"\x27]+["\x27]',lambda m:m.group(1)+'"1.3.26"',s,count=1)
          if n!=1:raise SystemExit('versionName missing')
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"; fi
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.26-debug-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
