name: MKmoney Widget Diagnostic APK (Fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/widget-diagnostic.yml'
      - 'MKmoney-Widget-Diagnostic-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          echo 'Searching repository for diagnostic source ZIP...'
          ZIP="$(find . -type f -iname '*widget*diagnostic*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo '::error::No widget diagnostic ZIP found. Upload MKmoney-Widget-Diagnostic-Source.zip to the repo Code tab, then commit.'
            exit 1
          fi
          echo "Found: $ZIP"
          mkdir -p "$RUNNER_TEMP/mkmoney-widget"
          unzip -o -q "$ZIP" -d "$RUNNER_TEMP/mkmoney-widget"
          SETTINGS="$(find "$RUNNER_TEMP/mkmoney-widget" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo '::error::ZIP has no settings.gradle. Upload the diagnostic SOURCE ZIP, not the APK or another MKmoney patch.'
            unzip -l "$ZIP" | head -50
            exit 1
          fi
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle" || { echo '::error::app/build.gradle is missing from diagnostic project'; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-Widget-Diagnostic-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
