name: Build MKmoney v1.3.10 APK (Today + Workweek)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.10-Today-Workweek-Update.zip'
      - 'MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check source and update ZIPs
        shell: bash
        run: |
          set -euo pipefail
          test -f MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip || { echo '::error::Existing v1.3.8 source ZIP not found in repository root'; exit 1; }
          test -f MKmoney-v1.3.10-Today-Workweek-Update.zip || { echo '::error::Upload MKmoney-v1.3.10-Today-Workweek-Update.zip to repository root'; exit 1; }
          PROJECT="$RUNNER_TEMP/mkmoney-source"
          mkdir -p "$PROJECT"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$PROJECT"
          unzip -q -o MKmoney-v1.3.10-Today-Workweek-Update.zip 'app/src/main/assets/index.html' -d "$PROJECT"
          for file in settings.gradle app/build.gradle app/src/main/assets/index.html; do
            test -f "$PROJECT/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          grep -q dashboardToday "$PROJECT/app/src/main/assets/index.html"
          echo 'Updated dashboard installed in Android project.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0' < /dev/null

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.10-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
