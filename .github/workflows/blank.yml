name: MKmoney v2.2 - Real Calendar to Widget Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v2.2-Calendar-to-Widget-Full-Source.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Extract complete v2.2 Android source
        shell: bash
        run: |
          set -euo pipefail
          test -s MKmoney-v2.2-Calendar-to-Widget-Full-Source.zip
          mkdir -p "$RUNNER_TEMP/MKmoney-v22"
          unzip -q MKmoney-v2.2-Calendar-to-Widget-Full-Source.zip -d "$RUNNER_TEMP/MKmoney-v22"
          echo "SOURCE_DIR=$RUNNER_TEMP/MKmoney-v22" >> "$GITHUB_ENV"
      - name: Verify the actual calendar-to-widget connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          root=Path(os.environ['SOURCE_DIR'])
          html=(root/'app/src/main/assets/index.html').read_text()
          native=(root/'app/src/main/java/au/com/paycycle/planner/MKNativeSyncBridge.java').read_text()
          widget=(root/'app/src/main/java/au/com/paycycle/planner/InteractiveCalendarWidget.java').read_text()
          manifest=(root/'app/src/main/AndroidManifest.xml').read_text()
          assertions={
           'Existing calendar recurrence source': 'function eventsBetween(first,last)' in html,
           'Calendar events sent through bridge': 'const occurrences=eventsBetween(first,lastDay)' in html,
           'Existing Settings Sync retained': 'mk-settings-sync-v22' in html,
           'Bridge parses payments array': 'incoming.getJSONArray("payments")' in native,
           'Bridge writes actual widget storage': '"mkmoney_calendar_widget"' in native,
           'Registered widget refreshed': 'new InteractiveCalendarWidget().onUpdate' in native,
           'Manifest registers that widget': 'InteractiveCalendarWidget' in manifest,
           'Widget reads same storage': '"mkmoney_calendar_widget"' in widget and 'p.getString("payments","[]")' in widget,
          }
          for label,ok in assertions.items():print(('PASS' if ok else 'FAIL'),label)
          if not all(assertions.values()):raise SystemExit('Widget integration assertions failed')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile MKmoney Android APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find "$SOURCE_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -t "$APK" | tail -2
          cp "$APK" release/MKmoney-v2.2-Calendar-to-Widget-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v2.2-Calendar-to-Widget-APK
          path: release/*.apk
          if-no-files-found: error
