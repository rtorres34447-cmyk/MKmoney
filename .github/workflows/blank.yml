name: MKmoney v2.0 - WebView Bridge Fix 82
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v2.0-v1.3.47-Widget-AddOn-FIX82.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact successful MKmoney v1.3.47 source
        shell: bash
        run: |
          set -euo pipefail
          test -s "MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip" || { echo "::error::Missing MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip"; exit 1; }
          test -s "MKmoney-v1.3.10-Today-Workweek-Update.zip" || { echo "::error::Missing MKmoney-v1.3.10-Today-Workweek-Update.zip"; exit 1; }
          test -s "MKmoney-v1.3.14-Logo-and-Banks-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.14-Logo-and-Banks-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.15-Weekly-Archive-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.15-Weekly-Archive-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.16-Paid-Archive-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.16-Paid-Archive-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.29-Validator-Fix.zip" || { echo "::error::Missing MKmoney-v1.3.29-Validator-Fix.zip"; exit 1; }
          test -s "MKmoney-v1.3.30-Bank-Funding-Workweeks.zip" || { echo "::error::Missing MKmoney-v1.3.30-Bank-Funding-Workweeks.zip"; exit 1; }
          test -s "MKmoney-v1.3.31-Week-Weekend-Collapse.zip" || { echo "::error::Missing MKmoney-v1.3.31-Week-Weekend-Collapse.zip"; exit 1; }
          test -s "MKmoney-v1.3.34-Combined-UI-Fix.zip" || { echo "::error::Missing MKmoney-v1.3.34-Combined-UI-Fix.zip"; exit 1; }
          test -s "MKmoney-v1.3.35-Panel-Placement-Fix.zip" || { echo "::error::Missing MKmoney-v1.3.35-Panel-Placement-Fix.zip"; exit 1; }
          test -s "MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.37-Full-Month-Sync-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.37-Full-Month-Sync-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.38-Theme-Sync-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.38-Theme-Sync-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.40-Restore-Full-Month-Widget-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.40-Restore-Full-Month-Widget-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.41-Interactive-Calendar-Patch.zip" || { echo "::error::Missing MKmoney-v1.3.41-Interactive-Calendar-Patch.zip"; exit 1; }
          test -s "MKmoney-v1.3.44-JSONObject-Compatibility-Fix.zip" || { echo "::error::Missing MKmoney-v1.3.44-JSONObject-Compatibility-Fix.zip"; exit 1; }
          test -s "MKmoney-v1.3.45-Widget-Data-Refresh-Fix.zip" || { echo "::error::Missing MKmoney-v1.3.45-Widget-Data-Refresh-Fix.zip"; exit 1; }
          test -s "MKmoney-v1.3.46-Native-Sync-Integration.zip" || { echo "::error::Missing MKmoney-v1.3.46-Native-Sync-Integration.zip"; exit 1; }
          test -s "MKmoney-v1.3.47-Bridge-Diagnostic.zip" || { echo "::error::Missing MKmoney-v1.3.47-Bridge-Diagnostic.zip"; exit 1; }
          test -s MKmoney-v2.0-v1.3.47-Widget-AddOn-FIX82.zip
          slots=(base update feature14 feature15 feature16 verify feature30 feature31 feature34 feature35 feature36 feature37 feature38 feature40 feature41 feature44 feature45 feature46 feature47)
          files=(
            "MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip"
            "MKmoney-v1.3.10-Today-Workweek-Update.zip"
            "MKmoney-v1.3.14-Logo-and-Banks-Patch.zip"
            "MKmoney-v1.3.15-Weekly-Archive-Patch.zip"
            "MKmoney-v1.3.16-Paid-Archive-Patch.zip"
            "MKmoney-v1.3.29-Validator-Fix.zip"
            "MKmoney-v1.3.30-Bank-Funding-Workweeks.zip"
            "MKmoney-v1.3.31-Week-Weekend-Collapse.zip"
            "MKmoney-v1.3.34-Combined-UI-Fix.zip"
            "MKmoney-v1.3.35-Panel-Placement-Fix.zip"
            "MKmoney-v1.3.36-Transparent-Calendar-Widget-Patch.zip"
            "MKmoney-v1.3.37-Full-Month-Sync-Patch.zip"
            "MKmoney-v1.3.38-Theme-Sync-Patch.zip"
            "MKmoney-v1.3.40-Restore-Full-Month-Widget-Patch.zip"
            "MKmoney-v1.3.41-Interactive-Calendar-Patch.zip"
            "MKmoney-v1.3.44-JSONObject-Compatibility-Fix.zip"
            "MKmoney-v1.3.45-Widget-Data-Refresh-Fix.zip"
            "MKmoney-v1.3.46-Native-Sync-Integration.zip"
            "MKmoney-v1.3.47-Bridge-Diagnostic.zip"
          )
          for i in "${!files[@]}"; do
            mkdir -p "$RUNNER_TEMP/${slots[$i]}"
            unzip -q "${files[$i]}" -d "$RUNNER_TEMP/${slots[$i]}"
          done
          SETTINGS="$(find "$RUNNER_TEMP/base" -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS"
          ROOT="$(dirname "$SETTINGS")"
          HTML="$(find "$RUNNER_TEMP/update" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$HTML"
          cp "$HTML" "$ROOT/app/src/main/assets/index.html"
          for version in feature14 feature15 feature16; do
            PATCH="$(find "$RUNNER_TEMP/$version" -type f -name apply_patch.py -print -quit)"
            python3 "$PATCH" "$ROOT"
          done
          python3 "$RUNNER_TEMP/verify/validate_features.py" "$ROOT" "$RUNNER_TEMP/update"
          python3 "$RUNNER_TEMP/feature30/apply_1330.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature31/apply_1331.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature34/v32/apply_1332.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature34/v33/apply_1333.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature35/apply_1335.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature36/apply_136.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature37/apply_1337.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature38/apply_1338.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature40/apply_1340.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature41/apply_1341.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature44/apply_native_widget.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature45/apply_1345.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature46/apply_1346.py" "$ROOT"
          python3 "$RUNNER_TEMP/feature47/apply_1347.py" "$ROOT"
          test -f "$ROOT/app/src/main/res/drawable/ic_launcher.png"
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"
      - name: Inject tested Widget Lab calendar as an add-on (no dashboard replacement)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mkmoney_v2_addon"
          unzip -q MKmoney-v2.0-v1.3.47-Widget-AddOn-FIX82.zip -d "$RUNNER_TEMP/mkmoney_v2_addon"
          python3 -m py_compile "$RUNNER_TEMP/mkmoney_v2_addon/integrate.py"
          python3 "$RUNNER_TEMP/mkmoney_v2_addon/integrate.py" "$SOURCE_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile MKmoney v2.0 APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and prepare APK and full source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK="$(find "$SOURCE_DIR/app/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo '::error::No compiled APK found'; exit 1; }
          test -s "$APK"
          unzip -t "$APK" | tail -2
          cp "$APK" release/MKmoney-v2.0-debug.apk
          cd "$SOURCE_DIR"
          zip -qr "$GITHUB_WORKSPACE/release/MKmoney-v2.0-Complete-Integrated-Source.zip" . -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v2.0-From-v1.3.47-APK-AND-SOURCE
          if-no-files-found: error
          path: release/*
