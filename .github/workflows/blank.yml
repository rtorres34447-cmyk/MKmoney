name: MKmoney v2.0 - Manifest Fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v2.0-Build-Fix-v2.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract actual MKmoney project and widget integration
        shell: bash
        run: |
          set -euo pipefail
          test -s MKmoney-Full-Source-v1.3.19.zip || { echo 'MKmoney source baseline missing'; exit 1; }
          test -s MKmoney-v2.0-Build-Fix-v2.zip || { echo 'Upload MKmoney-v2.0-Build-Fix-v2.zip to repository root'; exit 1; }
          mkdir -p project kitwork
          unzip -q MKmoney-Full-Source-v1.3.19.zip -d project
          unzip -q MKmoney-v2.0-Build-Fix-v2.zip -d kitwork
          mv kitwork/mkmoney2kit kit
          test -s project/app/src/main/assets/index.html
          python3 kit/integrate.py
      - name: Compile Android debug APK
        working-directory: project
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleDebug
      - name: Confirm installable APK exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=$(find project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -size +100k -print -quit)
          test -n "$APK" || { echo 'No compiled APK generated'; exit 1; }
          cp "$APK" release/MKmoney-v2.0-debug.apk
          unzip -t release/MKmoney-v2.0-debug.apk | tail -2
          cd project
          zip -qr ../release/MKmoney-v2.0-Integrated-Source.zip . -x '*/build/*' '*/.gradle/*'
      - name: Upload APK and integrated source
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v2.0-APK-AND-SOURCE
          if-no-files-found: error
          path: release/*
