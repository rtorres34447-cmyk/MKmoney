      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standalone Widget Lab debug APK
        working-directory: widgetlab-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Widget Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-Widget-Lab-v1.0-debug-apk
          path: widgetlab-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
