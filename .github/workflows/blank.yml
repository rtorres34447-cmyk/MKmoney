name: Build MKmoney v1.3.7 APK (Bank Breakdown)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.7-Bank-Breakdown-GitHub-Package.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP='MKmoney-v1.3.7-Bank-Breakdown-GitHub-Package.zip'
          test -f "$ZIP" || { echo "::error::Upload $ZIP to the repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mkmoney"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/mkmoney"
          PROJECT="$RUNNER_TEMP/mkmoney"
          for file in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            test -f "$PROJECT/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo '::error::Android SDK missing'; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1 || true)"
          test -n "$SDKMANAGER" || { echo '::error::sdkmanager missing'; exit 1; }
          if [[ ! -d "$SDK/platforms/android-35" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDKMANAGER" --sdk_root="$SDK" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
