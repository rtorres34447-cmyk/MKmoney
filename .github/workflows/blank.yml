name: Build MKmoney v1.3.8 APK (Logo Restored)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP in repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mkmoney-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/mkmoney-source"
          cd "$RUNNER_TEMP/mkmoney-source"
          test -f settings.gradle || { echo '::error::settings.gradle missing'; exit 1; }
          test -f app/build.gradle || { echo '::error::app/build.gradle missing'; exit 1; }
          test -f app/src/main/assets/index.html || { echo '::error::index.html missing'; exit 1; }
          echo "SOURCE_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Use preinstalled Android SDK and install API 35
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK location: $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER" || { echo '::error::sdkmanager not found'; exit 1; }
          # Do not use android-actions/setup-android@v3 here: that action tries
          # to install obsolete package "tools" and fails before the APK build.
          "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0' < /dev/null

      - name: Compile APK
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.8-debug-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
