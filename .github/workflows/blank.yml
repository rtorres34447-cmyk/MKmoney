name: Build MKmoney v1.3.8 APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.8-GitHub-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and extract uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="MKmoney-v1.3.8-GitHub-Source.zip"
          test -f "$ZIP" || { echo "::error::Missing $ZIP in repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/mkmoney-source"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/mkmoney-source"
          cd "$RUNNER_TEMP/mkmoney-source"
          test -f settings.gradle || { echo '::error::Missing settings.gradle'; exit 1; }
          test -f app/build.gradle || { echo '::error::Missing app/build.gradle'; exit 1; }
          test -f app/src/main/assets/index.html || { echo '::error::Missing dashboard index.html'; exit 1; }
          echo "SOURCE_DIR=$PWD" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile APK
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.8-debug-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
