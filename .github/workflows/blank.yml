name: Build MKmoney v1.3.4 APK (fixed)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail
          for file in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing $file. Extract the v1.3.4 package into the repository ROOT (not a nested folder)."
              exit 1
            fi
          done
          echo "Android project structure verified."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compile APK
        shell: bash
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.4-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
