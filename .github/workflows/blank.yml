name: Build MKmoney Full Source APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-Full-Source-v1.3.19.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract full Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f MKmoney-Full-Source-v1.3.19.zip || { echo '::error::Upload MKmoney-Full-Source-v1.3.19.zip to the repository root'; exit 1; }
          mkdir -p full-source
          unzip -q MKmoney-Full-Source-v1.3.19.zip -d full-source
          test -f full-source/app/src/main/assets/index.html
          test -f full-source/app/src/main/AndroidManifest.xml
          test -f full-source/settings.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: full-source
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.19-debug-APK
          path: full-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
