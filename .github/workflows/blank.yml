name: Build MKmoney v1.3.27 (v1.3.10 + features + logo)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.27-Clean-1310-Feature-Update.zip'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild from original v1.3.10 and apply feature-only patches
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip \
            MKmoney-v1.3.10-Today-Workweek-Update.zip \
            MKmoney-v1.3.14-Logo-and-Banks-Patch.zip \
            MKmoney-v1.3.15-Weekly-Archive-Patch.zip \
            MKmoney-v1.3.16-Paid-Archive-Patch.zip \
            MKmoney-v1.3.27-Clean-1310-Feature-Update.zip; do
            test -f "$file" || { echo "::error::Missing $file in repository root"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/update" "$RUNNER_TEMP/feature14" "$RUNNER_TEMP/feature15" "$RUNNER_TEMP/feature16" "$RUNNER_TEMP/verify"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/base"
          unzip -q MKmoney-v1.3.10-Today-Workweek-Update.zip -d "$RUNNER_TEMP/update"
          unzip -q MKmoney-v1.3.14-Logo-and-Banks-Patch.zip -d "$RUNNER_TEMP/feature14"
          unzip -q MKmoney-v1.3.15-Weekly-Archive-Patch.zip -d "$RUNNER_TEMP/feature15"
          unzip -q MKmoney-v1.3.16-Paid-Archive-Patch.zip -d "$RUNNER_TEMP/feature16"
          unzip -q MKmoney-v1.3.27-Clean-1310-Feature-Update.zip -d "$RUNNER_TEMP/verify"
          SETTINGS="$(find "$RUNNER_TEMP/base" -type f -name settings.gradle -print -quit)"
          test -n "$SETTINGS" || { echo '::error::Base Android project missing'; exit 1; }
          ROOT="$(dirname "$SETTINGS")"
          mkdir -p "$RUNNER_TEMP/original-java"
          cp -a "$ROOT/app/src/main/java" "$RUNNER_TEMP/original-java/java"
          ORIGINAL_HTML="$(find "$RUNNER_TEMP/update" -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          test -n "$ORIGINAL_HTML" || { echo '::error::v1.3.10 HTML missing'; exit 1; }
          cp "$ORIGINAL_HTML" "$ROOT/app/src/main/assets/index.html"
          for version in feature14 feature15 feature16; do
            PATCH="$(find "$RUNNER_TEMP/$version" -name apply_patch.py -type f -print -quit)"
            if [[ -z "$PATCH" ]]; then
              echo "::error::Missing apply_patch.py in $version patch"; exit 1
            fi
            python3 "$PATCH" "$ROOT"
          done
          # All native Java must be unchanged. Do not reinsert CSV WebChromeClient/onActivityResult.
          diff -qr "$RUNNER_TEMP/original-java/java" "$ROOT/app/src/main/java" || { echo '::error::Feature patch modified native Java'; exit 1; }
          test -f "$ROOT/app/src/main/res/drawable/ic_launcher.png" || { echo '::error::Original launcher icon missing'; exit 1; }
          python3 - "$ROOT" <<'PYVERIFY'
          import sys,re
          from pathlib import Path
          root=Path(sys.argv[1]); html=(root/'app/src/main/assets/index.html').read_text()
          print('Final HTML bytes:',len(html.encode()))
          print('Original Java preserved; checking launcher icon and source.')
          gradle=root/'app/build.gradle'
          if not gradle.exists():raise SystemExit('Missing app/build.gradle')
          s=gradle.read_text()
          s,n=re.subn(r'(\bversionName\s*(?:=\s*)?)["\'][^"\']+["\']',lambda m:m.group(1)+'"1.3.27"',s,count=1)
          if n!=1:raise SystemExit('versionName not found')
          gradle.write_text(s)
          PYVERIFY
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER" || MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          test -x "$MANAGER"
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.27-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
