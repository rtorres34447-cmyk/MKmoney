name: Build MKmoney v1.3.20 (Restore Original Logo)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blank.yml'
      - 'MKmoney-v1.3.20-Logo-Fix.zip'
      - 'MKmoney-Full-Source-v1.3.19.zip'
      - 'MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack latest complete source and original logo source
        shell: bash
        run: |
          set -euo pipefail
          for f in MKmoney-Full-Source-v1.3.19.zip MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip MKmoney-v1.3.20-Logo-Fix.zip; do
            test -f "$f" || { echo "::error::Missing $f from GitHub repo root"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/latest" "$RUNNER_TEMP/original" "$RUNNER_TEMP/fix"
          unzip -q MKmoney-Full-Source-v1.3.19.zip -d "$RUNNER_TEMP/latest"
          unzip -q MKmoney-v1.3.8-Logo-Restored-GitHub-Source.zip -d "$RUNNER_TEMP/original"
          unzip -q MKmoney-v1.3.20-Logo-Fix.zip -d "$RUNNER_TEMP/fix"
          LATEST_SETTINGS="$(find "$RUNNER_TEMP/latest" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          ORIGINAL_SETTINGS="$(find "$RUNNER_TEMP/original" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$LATEST_SETTINGS" || { echo '::error::Latest ZIP missing full Android project'; exit 1; }
          test -n "$ORIGINAL_SETTINGS" || { echo '::error::Original logo ZIP missing Android project'; exit 1; }
          ROOT="$(dirname "$LATEST_SETTINGS")"
          ORIGINAL="$(dirname "$ORIGINAL_SETTINGS")"
          test -f "$ROOT/app/src/main/assets/index.html" || { echo '::error::Latest source missing index.html'; exit 1; }
          python3 "$RUNNER_TEMP/fix/restore_logo.py" "$ROOT" "$ORIGINAL"
          echo "SOURCE_DIR=$ROOT" >> "$GITHUB_ENV"

      - name: Configure version
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['SOURCE_DIR'])
          gradle=next((p for p in (root/'app/build.gradle',root/'app/build.gradle.kts') if p.exists()),None)
          if not gradle:raise SystemExit('Missing app Gradle file')
          s=gradle.read_text()
          s,n=re.subn(r'(\bversionName\s*(?:=\s*)?)["\'][^"\']+["\']',lambda m:m.group(1)+'"1.3.20"',s,count=1)
          if n!=1:raise SystemExit('Cannot update versionName')
          gradle.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          MANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$MANAGER" ]]; then
            MANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          fi
          test -n "$MANAGER" && test -x "$MANAGER" || { echo '::error::sdkmanager missing'; exit 1; }
          yes | "$MANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$MANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.SOURCE_DIR }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MKmoney-v1.3.20-Original-Logo-APK
          path: ${{ env.SOURCE_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
